[project]
name = "discord-music-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "discord-py[voice]>=2.7.1",
    "python-dotenv>=1.2.4",
    "static-ffmpeg>=3.0",
    "yt-dlp>=2026.10.21",
]

[project.scripts]
discord-music-bot = "discord_music_bot:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"
